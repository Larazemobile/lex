<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lex — ÓrbitaKidx</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><circle cx='24' cy='24' r='20' fill='%233aa0ff' stroke='%2315172a' stroke-width='3'/><circle cx='17' cy='17' r='6' fill='%2346c66e'/><circle cx='31' cy='29' r='7' fill='%2346c66e'/><circle cx='17' cy='32' r='4' fill='%2346c66e'/><ellipse cx='17' cy='15' rx='5' ry='3' fill='%23ffffff' opacity='0.5'/></svg>">
<meta name="theme-color" content="#8fc1ff">
<meta name="apple-mobile-web-app-title" content="Lex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ====================== TOKENS ====================== */
:root{
  --sky1:#6fb7ff; --sky2:#bfe6ff;
  --grass:#5fb12b; --grass-d:#3f7d1c;
  --dirt:#7a4a25;
  --ink:#202338; --ink-soft:#4a4e6b;
  --panel:#ffffff; --panel-2:#f4f2ff;
  --line:#23263d;
  --gold:#ffcf3f; --gold-d:#e0a51e;
  --purple:#7b5cff; --purple-d:#553bc4;
  --green:#37c871; --green-d:#1f9c52;
  --red:#ff6b5e; --red-d:#d6463a;
  --orange:#ff9f43; --orange-d:#df7c1c;
  --teal:#22c6c6; --teal-d:#149a9a;
  --blue:#3d9bff; --blue-d:#2274d8;
  --pink:#ff6fae; --pink-d:#d6478a;
  --bronze:#cd874b; --silver:#cfd6e2;
  --pixel:'Fredoka', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --body:'Fredoka', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; font-family:var(--body); font-weight:500; color:var(--ink);
  background: linear-gradient(170deg, #8fc1ff 0%, #aec2ff 45%, #d6c9f6 100%);
  background-attachment:fixed;
  min-height:100%;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* fondo limpio: sin franja de hierba */
.app-wrap{position:relative; z-index:1; max-width:920px; margin:0 auto; padding:14px 14px 28px;}

/* ====================== SHARED BLOCKY LOOK ====================== */
.pixel{font-family:var(--pixel); letter-spacing:.2px; line-height:1.5;}
.btn,.logo h1,.stat b,.section-title,.card h3,.panel h2,.tile .tn,.pill .pl,.qmeta,.mult-q,.vsum,.answer-display,.key,.result-card .big,.medal h4,.modal h2{font-weight:700;}
.block{
  border:3px solid var(--line);
  box-shadow: inset 4px 4px 0 rgba(255,255,255,.35), inset -5px -5px 0 rgba(0,0,0,.18), 0 5px 0 rgba(0,0,0,.18);
  border-radius:10px;
}
.btn{
  font-family:var(--pixel); font-size:12px; color:#fff; cursor:pointer;
  border:3px solid var(--line); border-radius:10px; padding:14px 16px;
  background:var(--blue);
  box-shadow: inset 3px 3px 0 rgba(255,255,255,.4), inset -4px -4px 0 rgba(0,0,0,.22), 0 5px 0 rgba(0,0,0,.22);
  transition: transform .05s ease, box-shadow .05s ease, filter .1s;
  text-shadow: 2px 2px 0 rgba(0,0,0,.28);
  user-select:none;
}
.btn:hover{filter:brightness(1.06);}
.btn:active{transform:translateY(4px); box-shadow: inset 3px 3px 0 rgba(255,255,255,.4), inset -4px -4px 0 rgba(0,0,0,.22), 0 1px 0 rgba(0,0,0,.22);}
.btn.green{background:var(--green);} .btn.red{background:var(--red);}
.btn.gold{background:var(--gold); color:var(--ink); text-shadow:1px 1px 0 rgba(255,255,255,.4);}
.btn.purple{background:var(--purple);} .btn.orange{background:var(--orange);}
.btn.teal{background:var(--teal);} .btn.ghost{background:#fff; color:var(--ink); text-shadow:none;}
.btn.sm{font-size:10px; padding:10px 12px;}

/* ====================== HEADER ====================== */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.logo{display:flex; align-items:center; gap:10px; cursor:pointer;}
.logo .cube{width:42px; height:42px;}
.logo h1{font-family:var(--pixel); font-size:20px; margin:0; color:#fff;
  text-shadow: 3px 3px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink);}
.logo h1 b{color:var(--gold);}
.profile-chip{display:flex; align-items:center; gap:10px; background:#fff; padding:7px 12px 7px 8px; cursor:pointer;}
.profile-chip .av{width:38px; height:38px; border-radius:8px; border:2px solid var(--line); overflow:hidden; flex:none;}
.profile-chip .who{display:flex; flex-direction:column; line-height:1.1;}
.profile-chip .who .nm{font-weight:900; font-size:15px;}
.profile-chip .who .md{font-size:12px; color:var(--ink-soft); font-weight:700; display:flex; align-items:center; gap:4px;}

/* ====================== HOME ====================== */
.hero{background:#fff; padding:16px 18px 30px; margin-bottom:16px; position:relative; display:flex; align-items:center; justify-content:center; text-align:center; gap:14px; flex-wrap:wrap;}
.hero .big-av{width:74px; height:74px; border:3px solid var(--line); border-radius:12px; overflow:hidden; flex:none;}
.hero .htxt{flex:1; min-width:200px;}
.hero .htxt h2{margin:0 0 4px; font-size:22px; font-weight:900;}
.hero .htxt p{margin:0; color:var(--ink-soft); font-weight:700;}
.stat-row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:10px;}
.today-hearts{position:absolute; right:14px; bottom:8px; display:flex; align-items:center; gap:3px;}
.today-hearts .th-lbl{font-weight:800; font-size:11px; color:var(--ink-soft); margin-right:4px;}
.today-hearts svg{width:22px; height:21px;}
.stat{background:var(--panel-2); border:2px solid var(--line); border-radius:9px; padding:6px 10px; font-weight:800; font-size:13px; display:flex; align-items:center; gap:6px;}
.stat b{font-family:var(--pixel); font-size:13px;}
.today-hearts{position:absolute; right:14px; bottom:8px; display:flex; align-items:center; gap:3px;}
.today-hearts .th-lbl{font-weight:800; font-size:11px; color:var(--ink-soft); margin-right:4px;}
.today-hearts svg{width:22px; height:21px;}

.section-title{font-family:var(--pixel); color:#fff; font-size:14px; margin:18px 4px 12px; text-align:center;
  text-shadow:2px 2px 0 var(--ink);}
.grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
@media(min-width:640px){ .grid{grid-template-columns:repeat(3,1fr);} }
.card{background:#fff; cursor:pointer; padding:0; overflow:hidden; transition:transform .08s;}
.card:hover{transform:translateY(-3px);}
.card:active{transform:translateY(1px);}
.card .top{height:8px;}
.card .body{padding:16px 14px 18px; text-align:center;}
.card .ic{width:56px; height:56px; margin:2px auto 10px;}
.card h3{margin:0 0 4px; font-family:var(--pixel); font-size:12px;}
.card p{margin:0; font-size:13px; color:var(--ink-soft); font-weight:700;}
.card .mini-stars{margin-top:8px; font-size:14px; letter-spacing:2px; color:var(--gold-d);}

/* ====================== SELECTOR / PILLS ====================== */
.back-bar{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.panel{background:#fff; padding:18px; margin-bottom:14px; text-align:center;}
.panel h2{margin:0 0 4px; font-family:var(--pixel); font-size:16px;}
.panel .sub{color:var(--ink-soft); font-weight:700; margin:0 0 14px;}
.tables-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:12px; justify-content:center;}
.tile{background:var(--panel-2); border:3px solid var(--line); border-radius:12px; cursor:pointer; padding:14px 8px; text-align:center;
  box-shadow: inset 3px 3px 0 rgba(255,255,255,.6), inset -4px -4px 0 rgba(0,0,0,.12), 0 4px 0 rgba(0,0,0,.14);
  transition:transform .07s;}
.tile:hover{transform:translateY(-2px);}
.tile:active{transform:translateY(2px);}
.tile .tn{font-family:var(--pixel); font-size:20px; color:var(--purple-d);}
.tile .tl{font-size:12px; font-weight:800; color:var(--ink-soft); margin-top:3px;}
.tile .st{margin-top:6px; color:var(--gold-d); letter-spacing:1px; font-size:13px;}
.tile.mixto{background:linear-gradient(135deg,#ffe9a8,#ffd34d);}
.tile.mixto .tn{color:#a9701a; font-size:14px;}

.pills{display:flex; gap:12px; flex-wrap:wrap;}
.pill{flex:1; min-width:150px; cursor:pointer; background:var(--panel-2); border:3px solid var(--line); border-radius:12px; padding:14px; text-align:center;
  box-shadow: inset 3px 3px 0 rgba(255,255,255,.6), inset -4px -4px 0 rgba(0,0,0,.12), 0 4px 0 rgba(0,0,0,.14); transition:transform .07s;}
.pill:hover{transform:translateY(-2px);} .pill:active{transform:translateY(2px);}
.pill .pl{font-family:var(--pixel); font-size:12px;}
.pill .pd{font-size:12px; font-weight:700; color:var(--ink-soft); margin-top:6px;}
.pill .st{margin-top:8px; color:var(--gold-d); letter-spacing:2px;}
.pill.facil .pl{color:var(--green-d);} .pill.medio .pl{color:var(--orange-d);} .pill.dificil .pl{color:var(--red-d);}

.choose-row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:12px;}
.chip{cursor:pointer; background:var(--panel-2); border:2px solid var(--line); border-radius:9px; padding:8px 12px; font-weight:800; font-size:13px;}
.chip.on{background:var(--blue); color:#fff;}

/* ====================== QUIZ ====================== */
.quiz-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;}
.qmeta{font-family:var(--pixel); font-size:11px; color:#fff; text-shadow:2px 2px 0 var(--ink);}
.streak{display:flex; align-items:center; gap:6px; background:#fff; border:2px solid var(--line); border-radius:9px; padding:5px 10px; font-weight:900; font-size:14px;}
.progress{height:18px; background:#fff; border:3px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:16px;}
.progress .bar{height:100%; width:0%; background:linear-gradient(90deg,var(--green),var(--teal)); transition:width .35s ease;}

.qcard{background:#fff; padding:22px 18px; text-align:center; position:relative; overflow:hidden;}
.qcard.flash-ok{animation:flashok .5s;}
.qcard.flash-no{animation:flashno .5s;}
@keyframes flashok{0%{background:#d7ffe6;}100%{background:#fff;}}
@keyframes flashno{0%,20%,40%{transform:translateX(-8px);}10%,30%{transform:translateX(8px);}50%{transform:translateX(0); background:#ffe2de;}100%{background:#fff;}}

.mult-q{font-family:var(--pixel); font-size:42px; color:var(--ink); margin:10px 0 6px;}
@media(min-width:520px){ .mult-q{font-size:56px;} }
.mult-q .x{color:var(--purple);}

/* vertical column sums/restas */
.vsum{display:inline-block; text-align:right; font-family:var(--pixel); font-size:34px; color:var(--ink); margin:6px 0; min-width:170px; position:relative;}
@media(min-width:520px){ .vsum{font-size:44px; min-width:210px;} }
.vsum .row{padding:2px 6px 2px 50px; position:relative; letter-spacing:6px;}
.vsum .op{position:absolute; left:8px; color:var(--orange-d);}
.vsum hr{border:none; border-top:5px solid var(--line); margin:8px 0 4px;}
.vsum .res{color:var(--blue-d); min-height:40px;}
.vsum .res .cursor{color:var(--ink); animation:blink 1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}

.answer-box{margin:14px auto 6px; max-width:320px;}
.answer-display{font-family:var(--pixel); font-size:30px; background:var(--panel-2); border:3px solid var(--line); border-radius:10px; padding:12px; min-height:58px; letter-spacing:4px;}
.answer-display.empty{color:#b9b9cc;}

.feedback{min-height:26px; margin:10px 0 4px; font-weight:900; font-size:16px;}
.feedback.ok{color:var(--green-d);} .feedback.no{color:var(--red-d);}

/* keypad */
.keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:340px; margin:6px auto 2px;}
.key{font-family:var(--pixel); font-size:20px; padding:16px 0; cursor:pointer; background:#fff; color:var(--ink);
  border:3px solid var(--line); border-radius:12px;
  box-shadow: inset 3px 3px 0 rgba(255,255,255,.6), inset -4px -4px 0 rgba(0,0,0,.14), 0 4px 0 rgba(0,0,0,.16);
  transition:transform .05s; user-select:none;}
.key:active{transform:translateY(4px); box-shadow: inset 3px 3px 0 rgba(255,255,255,.6), inset -4px -4px 0 rgba(0,0,0,.14), 0 1px 0 rgba(0,0,0,.16);}
.key.del{background:var(--orange); color:#fff;}
.key.ok{background:var(--green); color:#fff; font-size:16px;}

/* ---- modo cuaderno (sumas con llevadas) ---- */
.cu-hint{min-height:22px; font-weight:700; color:var(--ink-soft); font-size:15px; margin-bottom:10px;}
.cu-hint-warn{color:var(--red-d);}
.cu-grid{display:grid; width:max-content; gap:4px 6px; align-items:end; margin:8px auto;}
.cu-d{height:42px; display:flex; align-items:center; justify-content:center; font-family:var(--pixel); font-weight:700; font-size:30px; color:var(--ink);}
.cu-op{height:42px; display:flex; align-items:center; justify-content:center; font-family:var(--pixel); font-weight:700; font-size:26px; color:var(--orange-d);}
.cu-carry{height:26px; display:flex; align-items:center; justify-content:center;}
.cu-line{grid-column:1 / -1; height:5px; background:var(--line); border-radius:3px; margin:4px 0;}
.cu-cell{display:flex; align-items:center; justify-content:center; font-family:var(--pixel); font-weight:700; border-radius:8px; cursor:pointer; transition:box-shadow .1s, background .1s;}
.cu-carrybox{width:24px; height:24px; font-size:15px; border:2px dashed var(--orange-d); color:var(--orange-d); background:#fff8ec;}
.cu-resbox{width:42px; height:46px; font-size:28px; border:3px solid var(--line); background:var(--panel-2); color:var(--ink);}
.cu-cell.active{box-shadow:0 0 0 4px rgba(61,155,255,.45); border-color:var(--blue);}
.cu-cell.ok{background:#d7ffe6; border-color:var(--green); color:var(--green-d);}
.cu-cell.bad{animation:flashno .42s; border-color:var(--red); color:var(--red-d);}
.cu-carrybox.active{border-color:var(--orange-d); box-shadow:0 0 0 4px rgba(255,159,67,.5);}
@keyframes cuPulse{0%,100%{box-shadow:0 0 0 3px rgba(255,159,67,.6); transform:scale(1);} 50%{box-shadow:0 0 0 7px rgba(255,159,67,.32); transform:scale(1.2);}}
.cu-hint.cu-hint-carry{display:inline-block; background:#fff1dc; border:2px solid var(--orange-d); border-radius:10px; padding:7px 12px; color:#9a5a00;}
.cu-struck{color:#9aa0b8; text-decoration:line-through; text-decoration-color:#ff5d6c; text-decoration-thickness:3px;}
.seg{display:inline-flex; border:3px solid var(--line); border-radius:12px; overflow:hidden; margin:2px 0 6px;}
.seg-btn{font-weight:800; font-size:13px; padding:8px 14px; cursor:pointer; background:#fff; color:var(--ink-soft);}
.seg-btn.on{background:var(--blue); color:#fff;}
.seg-btn+.seg-btn{border-left:3px solid var(--line);}
/* ---- modo estudio de tablas ---- */
.study-grid{display:grid; grid-template-columns:1fr; gap:8px; margin-top:6px;}
@media(min-width:480px){ .study-grid{grid-template-columns:1fr 1fr;} }
.study-row{background:var(--panel-2); border:2px solid var(--line); border-radius:10px; padding:9px 14px; font-family:var(--pixel); font-weight:700; font-size:18px; display:flex; justify-content:space-between; align-items:center;}
.study-row b{color:var(--purple-d);}
.study-q{display:inline-flex; align-items:center; justify-content:center; min-width:38px; height:30px; color:#fff; background:var(--blue); border:2px solid var(--line); border-radius:8px; cursor:pointer; box-shadow:inset 2px 2px 0 rgba(255,255,255,.3), inset -3px -3px 0 rgba(0,0,0,.18); transition:transform .06s;}
.study-q:active{transform:translateY(2px);}
.tip-box{background:#fff7df; border:2px solid var(--gold-d); border-radius:10px; padding:10px 12px; font-weight:700; color:#6b5210; margin:2px 0 12px; font-size:14px;}
.tip-box b{color:var(--orange-d);}
.review-box{background:#fff4f3; border:2px solid var(--red-d); border-radius:12px; padding:12px 14px; margin:16px auto 0; max-width:380px;}
.review-title{font-weight:800; color:var(--red-d); margin-bottom:8px;}
.review-list{display:flex; flex-direction:column; gap:6px;}
.review-item{font-family:var(--pixel); font-weight:700; font-size:15px; background:#fff; border:2px solid var(--line); border-radius:8px; padding:6px 8px;}

/* ====================== RESULTS ====================== */
.result-card{background:#fff; padding:26px 20px; text-align:center;}
.result-card .big{font-family:var(--pixel); font-size:38px; margin:6px 0;}
.result-card .stars-big{font-size:42px; letter-spacing:8px; color:var(--gold-d); margin:8px 0;}
.result-msg{font-weight:800; font-size:17px; margin:6px 0 16px; color:var(--ink-soft);}
.result-actions{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}

/* ====================== MEDALLAS ====================== */
.medals-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px;}
.medal{background:#fff; padding:14px 10px; text-align:center;}
.medal.locked{filter:grayscale(1) opacity(.55);}
.medal .msvg{width:64px; height:64px; margin:2px auto 8px;}
.medal h4{margin:0 0 3px; font-family:var(--pixel); font-size:10px;}
.medal p{margin:0; font-size:12px; font-weight:700; color:var(--ink-soft);}

/* ====================== MODAL / TOAST ====================== */
.modal-bg{position:fixed; inset:0; background:rgba(20,22,40,.6); display:flex; align-items:center; justify-content:center; padding:18px; z-index:50;}
.modal{background:#fff; max-width:440px; width:100%; padding:22px; max-height:90vh; overflow:auto;}
.modal h2{margin:0 0 6px; font-family:var(--pixel); font-size:16px;}
.modal p{margin:0 0 14px; font-weight:700; color:var(--ink-soft);}
.name-input{width:100%; font-family:var(--body); font-size:18px; font-weight:800; padding:12px; border:3px solid var(--line); border-radius:10px; margin-bottom:14px;}
.av-pick{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; max-height:46vh; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px;}
.pick-go{position:sticky; bottom:0; background:#fff; padding-top:12px; display:flex; justify-content:center;}
.pick-go .btn{width:100%; max-width:340px;}
.av-opt{border:3px solid var(--line); border-radius:12px; padding:6px; cursor:pointer; background:var(--panel-2);}
.av-opt.on{border-color:var(--blue); box-shadow:0 0 0 3px rgba(61,155,255,.4);}
.av-opt svg{width:100%; height:auto; display:block;}

.toast-wrap{position:fixed; left:0; right:0; bottom:18px; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:60; pointer-events:none;}
.toast{background:var(--gold); color:var(--ink); border:3px solid var(--line); border-radius:12px; padding:10px 16px 10px 12px; display:flex; align-items:center; gap:10px;
  box-shadow:0 6px 0 rgba(0,0,0,.2); font-weight:900; animation:pop .4s, fade .4s 3.4s forwards; max-width:90%;}
.toast svg{width:34px; height:34px; flex:none;}
.toast small{display:block; font-weight:800; color:var(--ink-soft); font-size:11px;}
@keyframes pop{0%{transform:scale(.6) translateY(20px); opacity:0;}100%{transform:scale(1) translateY(0); opacity:1;}}
@keyframes fade{to{opacity:0; transform:translateY(10px);}}

.confetti{position:fixed; top:-10px; width:10px; height:14px; z-index:40; pointer-events:none;}
.hidden{display:none !important;}
.footer-note{text-align:center; color:rgba(32,35,58,.6); font-weight:700; font-size:12px; margin-top:18px;}
.topright{display:flex; align-items:center; gap:10px;}
.sound-btn{width:44px; height:44px; display:flex; align-items:center; justify-content:center; background:#fff; cursor:pointer; padding:0;}
.wintro{text-align:center; padding:6px 2px;}
.wglobe{width:120px; height:120px; margin:6px auto 12px; animation:wfloat 3s ease-in-out infinite;}
.wglobe.sm{width:72px; height:72px; margin:4px auto 8px;}
@keyframes wfloat{0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)}}
h2.wtitle{font-size:30px; margin:0;}
h2.wtitle b{color:var(--gold);}
.wsub{color:var(--ink-soft); font-weight:700; margin:2px 0 18px;}
@media (max-width:480px){
  .app-wrap{padding:10px 10px 22px;}
  .qcard{padding:16px 12px;}
  .quiz-head{margin-bottom:8px;}
  .progress{height:14px; margin-bottom:10px;}
  .mult-q{font-size:38px; margin:6px 0 4px;}
  .answer-display{font-size:26px; min-height:46px; padding:8px;}
  .keypad{gap:8px; max-width:300px; margin:4px auto 0;}
  .key{font-size:18px; padding:12px 0;}
  .key.ok{font-size:14px;}
  .vsum{font-size:30px;}
  .feedback{min-height:20px; margin:6px 0 2px; font-size:15px;}
  .topbar{margin-bottom:10px;}
  .hero{padding:12px 12px 26px; gap:10px;}
  .hero .big-av{width:58px; height:58px;}
  .hero .htxt{min-width:140px;}
  .hero .htxt h2{font-size:18px;}

function sfx(type){ if(!soundOn()) return; try{ var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; if(!SND.ctx) SND.ctx=new AC(); var ctx=SND.ctx; if(ctx.state==='suspended') ctx.resume();
  var seq, wave='triangle';
  if(type==='ok'){ seq=[[660,0,.09],[990,.07,.12]]; }
  else if(type==='bad'){ seq=[[180,0,.22]]; wave='square'; }
  else if(type==='tap'){ seq=[[540,0,.05]]; }
  else if(type==='medal'){ seq=[[523,0,.1],[659,.1,.1],[784,.2,.16]]; }
  else if(type==='win'){ seq=[[523,0,.1],[659,.1,.1],[784,.2,.1],[1047,.32,.2]]; }
  else if(type==='start'){ seq=[[392,0,.09],[523,.09,.09],[784,.18,.18]]; }
  else { seq=[[600,0,.08]]; }
  for(var i=0;i<seq.length;i++){ var n=seq[i], o=ctx.createOscillator(), g=ctx.createGain(); o.type=wave; o.frequency.value=n[0]; o.connect(g); g.connect(ctx.destination); var t0=ctx.currentTime+n[1]; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.22,t0+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t0+n[2]); o.start(t0); o.stop(t0+n[2]+0.03); } }catch(e){} }

 {lvl:'facil', title:'El globo rojo', text:'Sofía tenía un globo rojo muy grande. Jugó con él en el jardín toda la tarde. De pronto, una ráfaga de viento se lo llevó volando hacia las nubes.', qs:[
   {q:'¿De qué color era el globo?',opts:['Rojo','Azul','Verde'],a:0},
   {q:'¿Dónde jugó Sofía?',opts:['En el jardín','En el salón','En el colegio'],a:0},
   {q:'¿Qué pasó con el globo?',opts:['Se rompió','Se lo llevó el viento','Lo guardó'],a:1} ]},
 {lvl:'facil', title:'Las galletas', text:'La abuela y Tomás hicieron galletas de mantequilla. Mezclaron la harina, el azúcar y un huevo. Las metieron al horno y la cocina olía riquísimo.', qs:[
   {q:'¿Qué hicieron?',opts:['Galletas','Pan','Una tarta'],a:0},
   {q:'¿Qué mezclaron?',opts:['Harina, azúcar y un huevo','Arroz','Verduras'],a:0},
   {q:'¿Cómo olía la cocina?',opts:['Mal','Riquísimo','A nada'],a:1} ]},
 {lvl:'facil', title:'El nido', text:'En la rama del árbol había un nido con tres huevos. Cada día, la mamá pájaro traía comida. Una mañana, los huevos se abrieron y nacieron tres polluelos.', qs:[
   {q:'¿Dónde estaba el nido?',opts:['En la rama de un árbol','En el suelo','En una caja'],a:0},
   {q:'¿Cuántos huevos había?',opts:['Tres','Dos','Cinco'],a:0},
   {q:'¿Qué nació de los huevos?',opts:['Polluelos','Mariposas','Ranas'],a:0} ]},
 {lvl:'facil', title:'La nieve', text:'Esta mañana todo estaba blanco: había nevado durante la noche. Los niños salieron con guantes y bufanda e hicieron un muñeco de nieve con una zanahoria de nariz.', qs:[
   {q:'¿Qué pasó durante la noche?',opts:['Llovió','Nevó','Hizo sol'],a:1},
   {q:'¿Qué se pusieron los niños?',opts:['Guantes y bufanda','Bañador','Sandalias'],a:0},
   {q:'¿Qué usaron de nariz?',opts:['Una zanahoria','Una piedra','Un palo'],a:0} ]},
 {lvl:'facil', title:'El mercado', text:'Los sábados, mamá e Iván van al mercado. Compran fruta fresca, pan caliente y un ramo de flores. Iván siempre elige unas manzanas para el postre.', qs:[
   {q:'¿Qué día van al mercado?',opts:['Los sábados','Los lunes','Los domingos'],a:0},
   {q:'¿Qué compran?',opts:['Fruta, pan y flores','Juguetes','Ropa'],a:0},
   {q:'¿Qué elige Iván?',opts:['Manzanas','Plátanos','Naranjas'],a:0} ]},

 {lvl:'medio', title:'El parque', text:'El sábado por la mañana, Hugo fue al parque con su abuelo. Llevaron pan para dar de comer a los patos del estanque. Hugo se subió al tobogán tres veces y luego montó en bici. Antes de volver a casa, compraron un helado de fresa.', qs:[
   {q:'¿Con quién fue Hugo al parque?',opts:['Con su madre','Con su abuelo','Solo'],a:1},
   {q:'¿Para qué llevaron pan?',opts:['Para los patos','Para merendar','Para los perros'],a:0},
   {q:'¿De qué era el helado?',opts:['Chocolate','Vainilla','Fresa'],a:2} ]},
 {lvl:'medio', title:'Una carta', text:'Marta recibió una carta de su prima Sara, que vive en un pueblo. En la carta le contaba que habían nacido cuatro cabritillas en la granja y la invitaba a pasar las vacaciones de verano allí. Marta se puso muy contenta.', qs:[
   {q:'¿Quién escribió la carta?',opts:['Su prima Sara','Su madre','Su profesora'],a:0},
   {q:'¿Qué nació en la granja?',opts:['Pollitos','Cabritillas','Conejos'],a:1},
   {q:'¿A qué la invitaba Sara?',opts:['A una fiesta','A pasar el verano','Al cine'],a:1} ]},
 {lvl:'medio', title:'El recreo', text:'En el recreo, Sara y sus amigas jugaron a la comba. Contaban los saltos en voz alta y la que más saltó fue Inés, que llegó hasta cincuenta sin parar. Después sonó el timbre y volvieron a clase.', qs:[
   {q:'¿A qué jugaron en el recreo?',opts:['Al fútbol','A la comba','Al escondite'],a:1},
   {q:'¿Quién saltó más?',opts:['Sara','Inés','Nadie'],a:1},
   {q:'¿Hasta qué número llegó?',opts:['Veinte','Cincuenta','Cien'],a:1} ]},
 {lvl:'medio', title:'El museo', text:'La clase de tercero visitó el museo de ciencias. Vieron un esqueleto de dinosaurio enorme y un planetario donde apagaban las luces para ver las estrellas. A Marcos lo que más le gustó fue tocar un meteorito de verdad.', qs:[
   {q:'¿Qué visitó la clase?',opts:['Un museo de ciencias','Un parque','Un castillo'],a:0},
   {q:'¿Qué vieron allí?',opts:['Un esqueleto de dinosaurio','Un tren','Cuadros'],a:0},
   {q:'¿Qué le gustó más a Marcos?',opts:['Las estrellas','Tocar un meteorito','El dinosaurio'],a:1} ]},
 {lvl:'medio', title:'La tormenta', text:'Por la tarde el cielo se puso muy oscuro. De repente, un rayo iluminó las nubes y, segundos después, se oyó un trueno fortísimo. Nico contaba los segundos entre el rayo y el trueno para saber si la tormenta estaba lejos o cerca.', qs:[
   {q:'¿Cómo se puso el cielo?',opts:['Despejado','Muy oscuro','Rosa'],a:1},
   {q:'¿Qué se oyó después del rayo?',opts:['Un trueno','Música','Nada'],a:0},
   {q:'¿Qué contaba Nico?',opts:['Las nubes','Los segundos','Los rayos'],a:1} ]},
 {lvl:'medio', title:'La bicicleta nueva', text:'Para su santo, Elena recibió una bicicleta roja con un timbre plateado. Su padre le enseñó a frenar poco a poco y, después de practicar todo el fin de semana, ya sabía dar vueltas sola por la plaza.', qs:[
   {q:'¿Qué le regalaron a Elena?',opts:['Una bicicleta','Unos patines','Un monopatín'],a:0},
   {q:'¿De qué color era?',opts:['Verde','Roja','Azul'],a:1},
   {q:'¿Quién le enseñó a frenar?',opts:['Su madre','Su padre','Su hermano'],a:1} ]},
 {lvl:'medio', title:'El concurso de dibujo', text:'El colegio organizó un concurso de dibujo sobre el fondo del mar. Lucas dibujó un pulpo morado rodeado de peces de colores. Aunque quedó en segundo lugar, la profesora colgó su dibujo en la entrada del cole para que todos lo vieran.', qs:[
   {q:'¿Sobre qué era el concurso?',opts:['El espacio','El fondo del mar','El bosque'],a:1},
   {q:'¿Qué dibujó Lucas?',opts:['Un pulpo','Un tiburón','Una ballena'],a:0},
   {q:'¿Dónde colgó la profesora su dibujo?',opts:['En clase','En la entrada del cole','En su casa'],a:1} ]},
 {lvl:'medio', title:'La excursión al campo', text:'El martes, toda la clase fue de excursión al campo. Llevaban lupas para observar los insectos y un cuaderno para apuntar lo que encontraban. Marina descubrió una fila de hormigas que cargaban hojas mucho más grandes que ellas.', qs:[
   {q:'¿A dónde fueron de excursión?',opts:['Al campo','Al museo','A la playa'],a:0},
   {q:'¿Para qué llevaban lupas?',opts:['Para observar insectos','Para leer','Para jugar'],a:0},
   {q:'¿Qué descubrió Marina?',opts:['Una fila de hormigas','Un nido','Una flor rara'],a:0} ]},
 {lvl:'medio', title:'El gato perdido', text:'Cuando Pablo volvió del colegio, su gato Pelusa no estaba. Buscó por toda la casa y por el jardín. Por fin lo encontró dormido dentro del cesto de la ropa limpia, hecho una bola.', qs:[
   {q:'¿Qué no estaba al volver Pablo?',opts:['Su gato','Su mochila','Su madre'],a:0},
   {q:'¿Dónde buscó?',opts:['Solo en su cuarto','Por la casa y el jardín','En el cole'],a:1},
   {q:'¿Dónde estaba el gato?',opts:['En el tejado','En el cesto de la ropa','En la calle'],a:1} ]},
 {lvl:'medio', title:'La obra de teatro', text:'Los alumnos de tercero prepararon una obra de teatro sobre un dragón y una princesa. Nerea hacía de dragón y llevaba un disfraz verde con alas de cartón. Al terminar, todos los padres aplaudieron muy fuerte.', qs:[
   {q:'¿Sobre qué era la obra?',opts:['Un dragón y una princesa','Piratas','Astronautas'],a:0},
   {q:'¿De qué hacía Nerea?',opts:['De princesa','De dragón','De árbol'],a:1},
   {q:'¿Qué hicieron los padres al final?',opts:['Se fueron','Aplaudieron','Cantaron'],a:1} ]},
 {lvl:'medio', title:'El partido de fútbol', text:'El equipo del barrio jugaba la final. Iban perdiendo por un gol, pero en el último minuto Daniel marcó dos veces seguidas. Sus compañeros lo levantaron en hombros para celebrar la victoria.', qs:[
   {q:'¿Qué partido jugaban?',opts:['Un amistoso','La final','El primero'],a:1},
   {q:'¿Cómo iban antes del último minuto?',opts:['Ganando','Perdiendo por un gol','Empatando'],a:1},
   {q:'¿Qué hizo Daniel?',opts:['Marcó dos goles','Falló','Se lesionó'],a:0} ]},
 {lvl:'medio', title:'La receta de la abuela', text:'La abuela de Clara guardaba sus recetas en un cuaderno viejo. Ese domingo le enseñó a preparar croquetas. Primero hicieron la masa, luego la dejaron enfriar y por último la rebozaron en pan rallado antes de freírla.', qs:[
   {q:'¿Dónde guardaba las recetas la abuela?',opts:['En el móvil','En un cuaderno viejo','En la tele'],a:1},
   {q:'¿Qué prepararon?',opts:['Croquetas','Galletas','Sopa'],a:0},
   {q:'¿Qué hicieron por último?',opts:['La masa','Rebozarla en pan rallado','Enfriarla'],a:1} ]},

 {lvl:'dificil', title:'El faro', text:'En lo alto de un acantilado se alzaba un viejo faro. Cada noche, su luz giraba sin descanso para avisar a los barcos del peligro de las rocas. El farero, don Tomás, llevaba treinta años cuidándolo. Los marineros decían que, gracias a esa luz, ningún barco se había hundido en aquella costa.', qs:[
   {q:'¿Dónde estaba el faro?',opts:['En una playa','En lo alto de un acantilado','En el puerto'],a:1},
   {q:'¿Para qué servía su luz?',opts:['Para decorar','Para avisar a los barcos','Para pescar'],a:1},
   {q:'¿Cuántos años llevaba don Tomás cuidándolo?',opts:['Treinta','Diez','Cien'],a:0} ]},
 {lvl:'dificil', title:'La biblioteca', text:'Daniela descubrió que en su barrio habían abierto una biblioteca nueva. El primer día sacó tres libros: uno de dinosaurios, otro de piratas y un cuento de hadas. La bibliotecaria le explicó que podía quedárselos quince días y que, si los cuidaba bien, podría llevarse más. Desde entonces, Daniela va cada semana.', qs:[
   {q:'¿Qué abrieron en el barrio?',opts:['Una piscina','Una biblioteca','Un parque'],a:1},
   {q:'¿Cuántos libros sacó el primer día?',opts:['Tres','Cinco','Uno'],a:0},
   {q:'¿Cuánto tiempo podía quedárselos?',opts:['Una semana','Quince días','Un mes'],a:1} ]},
 {lvl:'dificil', title:'El naufragio', text:'Hace muchos años, un barco mercante quedó atrapado en una fuerte tempestad cerca de la costa. Las olas eran tan altas que el capitán ordenó echar el ancla y esperar. Por suerte, al amanecer el mar se calmó y pudieron llegar a puerto con la carga intacta. Desde entonces, aquel capitán fue conocido como el más prudente de la región.', qs:[
   {q:'¿Qué le pasó al barco?',opts:['Quedó atrapado en una tempestad','Se hundió','Llegó tarde'],a:0},
   {q:'¿Qué ordenó el capitán?',opts:['Seguir navegando','Echar el ancla y esperar','Saltar al agua'],a:1},
   {q:'¿Cómo fue conocido el capitán después?',opts:['El más rápido','El más prudente','El más rico'],a:1} ]},
 {lvl:'dificil', title:'Las abejas', text:'Las abejas viven en colmenas formadas por miles de individuos. Las obreras salen a recoger el néctar de las flores y, al hacerlo, transportan el polen de una planta a otra. Gracias a ese trabajo, muchas plantas pueden dar frutos. Por eso se dice que las abejas son esenciales para la naturaleza.', qs:[
   {q:'¿Dónde viven las abejas?',opts:['En colmenas','En nidos','En cuevas'],a:0},
   {q:'¿Qué recogen de las flores?',opts:['Agua','Néctar','Hojas'],a:1},
   {q:'¿Por qué son importantes?',opts:['Hacen ruido','Ayudan a las plantas a dar frutos','Son bonitas'],a:1} ]},
 {lvl:'dificil', title:'El inventor', text:'Daniel pasaba las tardes en el garaje construyendo aparatos con piezas viejas. Un día montó un pequeño robot que seguía la luz de una linterna. Lo presentó en la feria de ciencias del colegio y, aunque no ganó el primer premio, el jurado destacó su imaginación y sus ganas de aprender.', qs:[
   {q:'¿Dónde construía Daniel sus aparatos?',opts:['En el garaje','En su cuarto','En el patio'],a:0},
   {q:'¿Qué montó un día?',opts:['Un coche','Un robot que seguía la luz','Un avión'],a:1},
   {q:'¿Qué destacó el jurado?',opts:['Su imaginación','Su rapidez','Su fuerza'],a:0} ]},
 {lvl:'dificil', title:'El viaje en tren', text:'La familia de Clara viajó en tren hasta la montaña. Durante el trayecto, vieron pasar campos de girasoles, túneles oscuros y un río que serpenteaba junto a las vías. Clara apuntó en su cuaderno todo lo que veía, porque quería escribir un relato sobre el viaje cuando llegaran.', qs:[
   {q:'¿A dónde viajó la familia?',opts:['A la playa','A la montaña','A la ciudad'],a:1},
   {q:'¿Qué vieron por la ventana?',opts:['Girasoles, túneles y un río','Solo casas','El mar'],a:0},
   {q:'¿Qué quería hacer Clara?',opts:['Dormir','Escribir un relato','Hacer fotos'],a:1} ]},
 {lvl:'dificil', title:'El desierto', text:'El desierto parece un lugar sin vida, pero esconde muchos secretos. Durante el día el calor es insoportable, así que la mayoría de los animales se esconden bajo la arena o entre las rocas. Solo al caer la noche, cuando refresca, salen a buscar alimento. Las plantas, como los cactus, almacenan agua en su interior para sobrevivir meses sin lluvia.', qs:[
   {q:'¿Por qué se esconden los animales de día?',opts:['Por el frío','Por el calor insoportable','Por el viento'],a:1},
   {q:'¿Cuándo salen a buscar alimento?',opts:['Al mediodía','Por la noche','Al amanecer'],a:1},
   {q:'¿Cómo sobreviven los cactus?',opts:['Almacenan agua','Comen insectos','Se mueven'],a:0} ]},
 {lvl:'dificil', title:'La imprenta', text:'Hace siglos, los libros se copiaban a mano, uno por uno, y tardaban muchísimo tiempo en terminarse. Por eso eran tan caros que casi nadie podía tenerlos. Cuando se inventó la imprenta, se pudieron hacer muchas copias en poco tiempo y los libros llegaron por fin a mucha más gente.', qs:[
   {q:'¿Cómo se hacían los libros antes?',opts:['A máquina','A mano','Con ordenador'],a:1},
   {q:'¿Por qué casi nadie tenía libros?',opts:['Eran muy caros','Eran aburridos','Pesaban mucho'],a:0},
   {q:'¿Qué cambió con la imprenta?',opts:['Se hicieron muchas copias rápido','Desaparecieron','Se encarecieron'],a:0} ]},
 {lvl:'dificil', title:'El volcán', text:'Un volcán es una montaña con una abertura conectada al interior de la Tierra. Allí dentro hay roca tan caliente que está derretida y se llama magma. Cuando la presión es muy grande, el magma sube y sale al exterior en una erupción. Al enfriarse, esa roca forma nuevas tierras.', qs:[
   {q:'¿Qué es el magma?',opts:['Roca derretida','Agua caliente','Humo'],a:0},
   {q:'¿Qué ocurre cuando la presión es muy grande?',opts:['Nieva','Hay una erupción','Se apaga'],a:1},
   {q:'¿Qué forma la roca al enfriarse?',opts:['Nuevas tierras','Nubes','Lluvia'],a:0} ]},
 {lvl:'dificil', title:'La migración de las aves', text:'Cuando llega el frío, muchas aves emprenden un largo viaje hacia países más cálidos. A esto se le llama migración. Vuelan miles de kilómetros en grupo, turnándose para ir delante y así cansarse menos. En primavera, cuando vuelve el buen tiempo, regresan al mismo lugar de donde partieron.', qs:[
   {q:'¿Por qué viajan las aves?',opts:['Por el frío','Por aburrimiento','Por el ruido'],a:0},
   {q:'¿Cómo vuelan para cansarse menos?',opts:['Solas','En grupo, turnándose','Muy bajo'],a:1},
   {q:'¿Cuándo regresan?',opts:['En verano','En primavera','En otoño'],a:1} ]},
 {lvl:'dificil', title:'El reloj de la torre', text:'En la plaza del pueblo había un antiguo reloj en lo alto de una torre. Cada hora, sus campanas sonaban tan fuerte que se oían desde lejos. Un relojero subía cada semana para darle cuerda con una gran llave de hierro. Gracias a él, el reloj nunca se paraba y todos sabían siempre la hora.', qs:[
   {q:'¿Dónde estaba el reloj?',opts:['En la iglesia','En lo alto de una torre','En el ayuntamiento'],a:1},
   {q:'¿Cada cuánto subía el relojero?',opts:['Cada día','Cada semana','Cada mes'],a:1},
   {q:'¿Para qué subía?',opts:['Para limpiarlo','Para darle cuerda','Para pintarlo'],a:1} ]},
 {lvl:'dificil', title:'El astrónomo', text:'Galileo fue uno de los primeros en observar el cielo con un telescopio. Gracias a él descubrió que la Luna tenía montañas y que el planeta Júpiter tenía lunas girando a su alrededor. Sus observaciones ayudaron a entender que la Tierra no era el centro de todo, como se creía entonces.', qs:[
   {q:'¿Con qué observaba el cielo Galileo?',opts:['Con un telescopio','Con prismáticos','A simple vista'],a:0},
   {q:'¿Qué descubrió sobre Júpiter?',opts:['Que tenía lunas','Que era rojo','Que era el más pequeño'],a:0},
   {q:'¿Qué se creía entonces?',opts:['Que la Tierra era el centro','Que no había estrellas','Que la Luna era plana'],a:0} ]},
 {lvl:'facil', title:'El semáforo', text:'Antes de cruzar la calle, Ana mira el semáforo. Si está en rojo, los coches pasan y ella espera. Cuando se pone verde para los peatones, cruza mirando a los dos lados.', qs:[
   {q:'¿Qué mira Ana antes de cruzar?',opts:['El semáforo','El reloj','El cielo'],a:0},
   {q:'¿Qué hace si está en rojo?',opts:['Cruza corriendo','Espera','Se sienta'],a:1},
   {q:'¿Qué hace al cruzar?',opts:['Mira a los dos lados','Cierra los ojos','Corre'],a:0} ]},
 {lvl:'facil', title:'El tren de juguete', text:'A Mateo le regalaron un tren de juguete azul. Montó las vías por todo el salón y el tren daba vueltas haciendo un ruido divertido. Su perro lo seguía moviendo la cola.', qs:[
   {q:'¿Qué le regalaron a Mateo?',opts:['Un tren de juguete','Una bici','Un balón'],a:0},
   {q:'¿Dónde montó las vías?',opts:['En el salón','En el jardín','En el cole'],a:0},
   {q:'¿Quién seguía al tren?',opts:['Su perro','Su gato','Su hermano'],a:0} ]},
 {lvl:'facil', title:'La sopa', text:'Hacía mucho frío en la calle. Mamá preparó una sopa caliente de fideos para cenar. A Julia le gustó tanto que repitió dos veces.', qs:[
   {q:'¿Qué tiempo hacía?',opts:['Calor','Frío','Viento'],a:1},
   {q:'¿Qué preparó mamá?',opts:['Sopa de fideos','Pizza','Ensalada'],a:0},
   {q:'¿Cuántas veces repitió Julia?',opts:['Una','Dos','Ninguna'],a:1} ]},
 {lvl:'facil', title:'El arcoíris', text:'Después de la lluvia salió el sol. En el cielo apareció un arcoíris con muchos colores. Los niños salieron al patio para mirarlo y lo señalaban con el dedo.', qs:[
   {q:'¿Qué apareció en el cielo?',opts:['Un arcoíris','Una estrella','La luna'],a:0},
   {q:'¿Cuándo apareció?',opts:['Antes de llover','Después de la lluvia','De noche'],a:1},
   {q:'¿Qué hacían los niños?',opts:['Lo señalaban','Lo pintaban','Dormían'],a:0} ]},
 {lvl:'medio', title:'La feria', text:'El domingo llegó la feria al pueblo. Sara se montó en los coches de choque y en una noria desde la que se veían todas las casas. Para terminar, su padre le compró un algodón de azúcar rosa.', qs:[
   {q:'¿Cuándo llegó la feria?',opts:['El sábado','El domingo','El lunes'],a:1},
   {q:'¿Desde qué atracción se veían las casas?',opts:['La noria','Los coches de choque','El tiovivo'],a:0},
   {q:'¿Qué le compró su padre?',opts:['Un helado','Un algodón de azúcar','Palomitas'],a:1} ]},
 {lvl:'medio', title:'El acuario', text:'En el acuario, los niños caminaron por un túnel de cristal mientras los tiburones nadaban sobre sus cabezas. La guía les explicó que los pulpos pueden cambiar de color para esconderse de sus enemigos.', qs:[
   {q:'¿Por dónde caminaron los niños?',opts:['Un túnel de cristal','Un puente','Una cueva'],a:0},
   {q:'¿Qué nadaba sobre sus cabezas?',opts:['Tiburones','Patos','Ballenas'],a:0},
   {q:'¿Qué pueden hacer los pulpos?',opts:['Cambiar de color','Volar','Hablar'],a:0} ]},
 {lvl:'medio', title:'El experimento', text:'Para la feria de ciencias, el grupo de Laura construyó un volcán con cartón y pintura. Cuando mezclaron vinagre con bicarbonato, salió una espuma que parecía lava de verdad. Todos aplaudieron al ver el experimento.', qs:[
   {q:'¿Qué construyó el grupo de Laura?',opts:['Un volcán','Un cohete','Un robot'],a:0},
   {q:'¿Qué mezclaron?',opts:['Vinagre y bicarbonato','Agua y arena','Leche y azúcar'],a:0},
   {q:'¿A qué se parecía la espuma?',opts:['A nubes','A lava','A nieve'],a:1} ]},
 {lvl:'medio', title:'La carrera', text:'Todos los años, el colegio organiza una carrera por el parque. Este año, Mateo entrenó cada tarde con su hermano mayor. El día de la carrera estaba nervioso, pero llegó el tercero y se puso muy contento con su medalla.', qs:[
   {q:'¿Dónde se hace la carrera?',opts:['En el parque','En el patio','En la calle'],a:0},
   {q:'¿Con quién entrenó Mateo?',opts:['Con su hermano mayor','Con su padre','Solo'],a:0},
   {q:'¿En qué puesto llegó?',opts:['Primero','Tercero','Último'],a:1} ]},
 {lvl:'dificil', title:'Los castores', text:'Los castores son grandes constructores. Con ramas, barro y troncos levantan presas que detienen el agua de los ríos y forman pequeños lagos. Dentro construyen su madriguera, con la entrada bajo el agua para protegerse de los depredadores.', qs:[

function sessionsToday(){ var hoy=new Date().toISOString().slice(0,10); return (DATA.stats.lastDay===hoy)?(DATA.stats.todayCount||0):0; }
function heartFull(){ return '<svg viewBox="-2 -2 36 34"><path d="M23.6 2c-3.4 0-6.3 2.7-7.6 5-1.3-2.3-4.2-5-7.6-5C3.8 2 0 5.6 0 10.2 0 17 8 22 16 27.5 24 22 32 17 32 10.2 32 5.6 28.2 2 23.6 2z" fill="#ff5d6c" stroke="#23263d" stroke-width="2.4" stroke-linejoin="round"/><ellipse cx="9" cy="9" rx="3.4" ry="2.3" fill="#ffffff" opacity="0.6" transform="rotate(-20 9 9)"/></svg>'; }
function heartEmpty(){ return '<svg viewBox="-2 -2 36 34"><path d="M23.6 2c-3.4 0-6.3 2.7-7.6 5-1.3-2.3-4.2-5-7.6-5C3.8 2 0 5.6 0 10.2 0 17 8 22 16 27.5 24 22 32 17 32 10.2 32 5.6 28.2 2 23.6 2z" fill="#e6e9f2" stroke="#aab0c4" stroke-width="2.4" stroke-linejoin="round"/></svg>'; }
function heartsHTML(){ var n=sessionsToday(), slots=(n>6?6:Math.max(n,3)), h='', i; for(i=0;i<slots;i++) h+=(i<n?heartFull():heartEmpty()); if(n>6) h+='<span style="font-weight:800;margin-left:2px;color:var(--ink-soft)">+</span>'; return h; }
function renderHome(){ var s=DATA.stats, medals=unlockedCount();
  var html='<div class="hero block"><div class="big-av">'+avatarSVG(DATA.avatar)+'</div><div class="htxt"><h2>¡Hola, '+escapeHtml(DATA.name||"jugador")+'!</h2><p>¿Listo para leer y aprender hoy? Elige un mundo.</p>'
   +'<div class="stat-row"><div class="stat">✅ <b>'+s.totalCorrect+'</b> aciertos</div><div class="stat">🔥 mejor racha <b>'+s.bestStreak+'</b></div><div class="stat">🏅 <b>'+medals+'</b>/'+ACHIEVEMENTS.length+' medallas</div></div></div><div class="today-hearts" title="Partidas jugadas hoy"><span class="th-lbl">Hoy</span>'+heartsHTML()+'</div></div>'
   +'<div class="section-title">ELIGE TU MUNDO</div><div class="grid">'
   +modeCard("var(--purple)","book","Comprensión","Lee y responde","selLec()")
   +modeCard("var(--green)","abc","Vocabulario","¿Qué significa?","selVoc()")
   +modeCard("var(--orange)","pencil","Ortografía","Escribe sin faltas","selOrt()")
   +modeCard("var(--gold)","target","Examen","Pon a prueba lo aprendido","selExam()")
   +modeCard("var(--teal)","star","Medallas","Mira tus logros","renderMedallas()")
   +modeCard("var(--blue)","trophy","Progreso","Tu mapa de estrellas","renderProgress()")
   +'</div>';
  $("screen").innerHTML=html;
}
function diffPanel(mode,title,descs){ var keys=["facil","medio","dificil"],labels=["Fácil","Medio","Difícil"],cls=["facil","medio","dificil"];
  var html=backBar(title)+'<div class="panel block"><h2>'+title+'</h2><p class="sub">Elige la dificultad y a por ello.</p><div class="pills">';
  for(var i=0;i<3;i++){ var st=DATA.stars[mode][keys[i]]||0; html+='<div class="pill '+cls[i]+'" onclick="startQuiz(\''+mode+'\',\''+keys[i]+'\',\''+title+' · '+labels[i]+'\',false)"><div class="pl">'+labels[i]+'</div><div class="pd">'+descs[i]+'</div><div class="st">'+starStr(st)+'</div></div>'; }
  html+='</div></div>'; $("screen").innerHTML=html; window.scrollTo(0,0);
}
function selLec(){ diffPanel("lec","Comprensión lectora",["Textos cortitos","Textos medianos","Textos más largos"]); }
function selVoc(){ diffPanel("voc","Vocabulario",["Palabras fáciles","Un poco más","Palabras difíciles"]); }
function selOrt(){ diffPanel("ort","Ortografía",["b/v, h…","tildes, ll/y…","palabras difíciles"]); }
var examSel={diff:"medio"};
function selExam(){ var html=backBar("Examen")+'<div class="panel block"><h2>Prepara tu examen</h2><p class="sub">10 preguntas mezcladas. ¡Saca 10/10 para una medalla!</p><div style="font-weight:900;margin:6px 0 8px">Dificultad</div><div class="choose-row" id="exd">'
   +'<div class="chip" data-d="facil" onclick="examSel.diff=\'facil\';upEx()">Fácil</div><div class="chip" data-d="medio" onclick="examSel.diff=\'medio\';upEx()">Medio</div><div class="chip" data-d="dificil" onclick="examSel.diff=\'dificil\';upEx()">Difícil</div></div>'
   +'<div style="margin-top:16px;text-align:center"><div class="btn gold" style="display:inline-block" onclick="startExam()">¡Empezar examen!</div></div></div>';
  $("screen").innerHTML=html; window.scrollTo(0,0); upEx();
}
function upEx(){ var c=document.querySelectorAll('#exd .chip'); for(var i=0;i<c.length;i++) c[i].classList.toggle('on', c[i].getAttribute('data-d')===examSel.diff); }
function startExam(){ var dl={facil:"Fácil",medio:"Medio",dificil:"Difícil"}; startQuiz("exam",examSel.diff,"Examen · "+dl[examSel.diff],true); }

function buildItems(mode,level,n,isExam){ var items=[];
  function fromLec(lv){ var out=[]; for(var i=0;i<LEC.length;i++){ if(LEC[i].lvl===lv){ for(var j=0;j<LEC[i].qs.length;j++){ var qq=LEC[i].qs[j]; out.push({ctx:LEC[i].title+"|"+LEC[i].text, q:qq.q, opts:qq.opts.slice(), a:qq.a}); } } } return out; }
  function fromList(L,lv){ var out=[]; for(var i=0;i<L.length;i++){ if(L[i].lvl===lv) out.push({q:L[i].q, opts:L[i].opts.slice(), a:L[i].a}); } return out; }
  if(isExam){ items=items.concat(fromLec(level), fromList(VOC,level), fromList(ORT,level)); shuffle(items); items=items.slice(0,n); }
  else if(mode==='lec'){
    var texts=[]; for(var ti=0;ti<LEC.length;ti++){ if(LEC[ti].lvl===level) texts.push(LEC[ti]); }
    shuffle(texts);
    for(var tj=0; tj<texts.length && items.length<n; tj++){ var T=texts[tj]; var qs=shuffle(T.qs.slice()).slice(0,2);
      for(var qi=0; qi<qs.length; qi++){ items.push({ctx:T.title+"|"+T.text, q:qs[qi].q, opts:qs[qi].opts.slice(), a:qs[qi].a}); } }
    items=items.slice(0,n);
  }
  else if(mode==='voc'){ items=fromList(VOC,level); shuffle(items); items=items.slice(0,n); }
  else { items=fromList(ORT,level); shuffle(items); items=items.slice(0,n); }
  return items;
}
function startQuiz(mode,level,label,isExam){ var n=10; var items=buildItems(mode,level,n,isExam);
  QUIZ={mode:mode,level:level,label:label,isExam:!!isExam,items:items,index:0,correct:0,count:items.length,answered:false,streak:0,wrong:[]};
  renderQuiz(); window.scrollTo(0,0);
}
function renderQuiz(){ var it=QUIZ.items[QUIZ.index], pct=Math.round(QUIZ.index/QUIZ.count*100);
  var opts=''; for(var i=0;i<it.opts.length;i++){ opts+='<div class="opt-btn" id="opt'+i+'" onclick="answer('+i+')">'+escapeHtml(it.opts[i])+'</div>'; }
  var ctx=''; if(it.ctx){ var p=it.ctx.split("|"); ctx='<div class="read-box"><span class="rt">'+escapeHtml(p[0])+'</span>'+escapeHtml(p[1])+'</div>'; }
  var html='<div class="back-bar"><div class="btn ghost sm" onclick="goHome()">⟵ Salir</div><div class="streak"><svg width="16" height="16" viewBox="0 0 24 24" fill="#ff7a00">'+iconPath("flame")+'</svg> x'+QUIZ.streak+'</div></div>'
   +'<div class="quiz-head"><div class="qmeta">'+(QUIZ.isExam?'EXAMEN':'PRÁCTICA')+' · '+(QUIZ.index+1)+'/'+QUIZ.count+'</div><div class="qmeta">'+escapeHtml(QUIZ.label)+'</div></div>'
   +'<div class="progress"><div class="bar" style="width:'+pct+'%"></div></div>'
   +'<div class="qcard block" id="qcard">'+ctx+'<div class="q-text">'+escapeHtml(it.q)+'</div><div class="opts">'+opts+'</div><div class="feedback" id="fb"></div></div>';
  $("screen").innerHTML=html; QUIZ.answered=false;
}
function answer(i){ if(!QUIZ||QUIZ.answered) return; var it=QUIZ.items[QUIZ.index]; QUIZ.answered=true;
  DATA.stats.totalAnswered++;
  var ok=(i===it.a), fb=$("fb");
  for(var k=0;k<it.opts.length;k++){ var b=$("opt"+k); if(!b) continue; b.style.pointerEvents='none'; if(k===it.a) b.classList.add('ok'); else if(k===i) b.classList.add('bad'); else b.classList.add('dim'); }
  if(ok){ DATA.stats.totalCorrect++; QUIZ.correct++; QUIZ.streak++; if(QUIZ.streak>DATA.stats.bestStreak) DATA.stats.bestStreak=QUIZ.streak;
    if(QUIZ.mode==='lec'||(QUIZ.isExam&&it.ctx)) DATA.stats.lec.correct++; else if(QUIZ.mode==='voc') DATA.stats.voc.correct++; else if(QUIZ.mode==='ort') DATA.stats.ort.correct++;
    fb.className='feedback ok'; fb.textContent=pick(['¡Genial!','¡Correcto!','¡Muy bien!','¡Eres crack!']); sfx('ok'); saveData(); checkAchievements(); setTimeout(nextQ,800);
  } else { QUIZ.streak=0; QUIZ.wrong.push(it); fb.className='feedback no'; fb.innerHTML='La correcta era <b>'+escapeHtml(it.opts[it.a])+'</b>'; sfx('bad'); saveData(); checkAchievements();
    var c=$("qcard"); c.innerHTML += '<div style="margin-top:14px"><div class="btn red" onclick="nextQ()">Siguiente ➜</div></div>';
  }
}
function nextQ(){ QUIZ.index++; if(QUIZ.index>=QUIZ.count){ finishQuiz(); return; } renderQuiz(); }
function finishQuiz(){ var score=QUIZ.correct,total=QUIZ.count, stars= score>=total?3: score>=Math.ceil(total*0.7)?2: score>=Math.ceil(total*0.5)?1:0;
  if(QUIZ.mode==='lec'||QUIZ.mode==='voc'||QUIZ.mode==='ort'){ DATA.stars[QUIZ.mode][QUIZ.level]=Math.max(DATA.stars[QUIZ.mode][QUIZ.level]||0,stars); }
  if(QUIZ.isExam){ DATA.stats.exams.completed++; if(score===total) DATA.stats.exams.perfect++; }
  DATA.stats.sessions=(DATA.stats.sessions||0)+1; var hoy=new Date().toISOString().slice(0,10);
  if(DATA.stats.lastDay!==hoy){ DATA.stats.days=(DATA.stats.days||0)+1; DATA.stats.lastDay=hoy; DATA.stats.todayCount=1; } else { DATA.stats.todayCount=(DATA.stats.todayCount||0)+1; }
  saveData(); var nw=checkAchievements(); renderResults(score,total,stars,nw);
}
function fmtWrong(it){ return escapeHtml(it.q)+' → '+escapeHtml(it.opts[it.a]); }
function renderResults(score,total,stars,nw){ sfx(score>=total?'win':'ok'); if(score>=total) confettiBurst();
  var msg= score>=total?'¡PERFECTO! 🏆': score>=total*0.7?'¡Casi perfecto!': score>=total*0.5?'¡Cada vez mejor!':'¡Sigue practicando!';
  var color= score>=total?'var(--gold)': score>=total*0.5?'var(--green)':'var(--orange)';
  var med=''; if(nw&&nw.length){ med='<div style="margin:14px 0 4px;font-weight:900">¡Medallas nuevas!</div><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">'; nw.forEach(function(a){ med+='<div style="text-align:center;width:90px">'+medalSVG(a.tier,a.icon,false)+'<div style="font-family:var(--pixel);font-weight:700;font-size:9px;margin-top:2px">'+a.name+'</div></div>'; }); med+='</div>'; }
  var rev=''; if(QUIZ.wrong&&QUIZ.wrong.length){ var seen={},items=[]; for(var i=0;i<QUIZ.wrong.length;i++){ var t=fmtWrong(QUIZ.wrong[i]); if(!seen[t]){seen[t]=1;items.push(t);} } var lis=''; for(var j=0;j<items.length;j++) lis+='<div class="review-item">'+items[j]+'</div>'; rev='<div class="review-box"><div class="review-title">Para repasar:</div><div class="review-list">'+lis+'</div></div>'; }
  var html='<div class="result-card block"><div style="font-family:var(--pixel);font-weight:700;font-size:12px;color:var(--ink-soft)">'+escapeHtml(QUIZ.label)+'</div><div class="big" style="color:'+color+'">'+score+' / '+total+'</div><div class="stars-big">'+starStr(stars)+'</div><div class="result-msg">'+msg+'</div>'+med+rev+'<div class="result-actions" style="margin-top:18px"><div class="btn green" onclick="repeatQuiz()">Repetir</div><div class="btn ghost" onclick="goHome()">Inicio</div></div></div>';
  $("screen").innerHTML=html; window.scrollTo(0,0);
}
function repeatQuiz(){ startQuiz(QUIZ.mode,QUIZ.level,QUIZ.label,QUIZ.isExam); }
function renderMedallas(){ var html=backBar("Mis medallas")+'<div class="panel block"><h2>'+unlockedCount()+' / '+ACHIEVEMENTS.length+' conseguidas</h2><p class="sub">Sigue practicando para desbloquearlas todas.</p><div class="medals-grid">';
  for(var i=0;i<ACHIEVEMENTS.length;i++){ var a=ACHIEVEMENTS[i], got=!!DATA.achievements[a.id]; html+='<div class="medal block '+(got?'':'locked')+'">'+medalSVG(a.tier,a.icon,!got)+'<h4>'+a.name+'</h4><p>'+a.desc+'</p></div>'; }
  html+='</div></div>'; $("screen").innerHTML=html; window.scrollTo(0,0);
}
function progBlock(title,mode){ var keys=["facil","medio","dificil"],labels=["Fácil","Medio","Difícil"]; var h='<div class="panel block"><h2>'+title+'</h2><div class="pills">'; for(var i=0;i<3;i++){ var st=DATA.stars[mode][keys[i]]||0; h+='<div class="pill" style="cursor:default"><div class="pl">'+labels[i]+'</div><div class="st">'+starStr(st)+'</div></div>'; } return h+'</div></div>'; }
function renderProgress(){ var s=DATA.stats, html=backBar("Mi progreso")+progBlock("Comprensión","lec")+progBlock("Vocabulario","voc")+progBlock("Ortografía","ort")
   +'<div class="panel block"><h2>Estadísticas</h2><div class="stat-row"><div class="stat">Respondidas <b>'+s.totalAnswered+'</b></div><div class="stat">Aciertos <b>'+s.totalCorrect+'</b></div><div class="stat">Mejor racha <b>'+s.bestStreak+'</b></div><div class="stat">Exámenes <b>'+s.exams.completed+'</b></div><div class="stat">Sesiones <b>'+(s.sessions||0)+'</b></div><div class="stat">Días <b>'+(s.days||0)+'</b></div></div><div style="margin-top:16px"><div class="btn red sm" onclick="confirmReset()">Reiniciar todo el progreso</div></div></div>';
  $("screen").innerHTML=html; window.scrollTo(0,0);
}
function confirmReset(){ showModal('<h2>¿Reiniciar todo?</h2><p>Se borrarán medallas, estrellas y estadísticas. No se puede deshacer.</p><div class="result-actions"><div class="btn red" onclick="doReset()">Borrar todo</div><div class="btn ghost" onclick="closeModal()">Cancelar</div></div>'); }
function doReset(){ var nm=DATA.name,av=DATA.avatar,pr=DATA.prefs; DATA=defaultData(); DATA.name=nm; DATA.avatar=av; DATA.onboarded=true; DATA.prefs=pr; saveData(); refreshChip(); closeModal(); goHome(); }

/* modal / perfil / onboarding */
var pickAvIdx=0;
function showModal(inner,noClose){ var bg=document.createElement('div'); bg.className='modal-bg'; bg.innerHTML='<div class="modal block">'+inner+'</div>'; if(!noClose){ bg.addEventListener('click',function(e){ if(e.target===bg) closeModal(); }); } $("modalHost").innerHTML=''; $("modalHost").appendChild(bg); }
function closeModal(){ $("modalHost").innerHTML=''; }
function pickAv(i){ pickAvIdx=i; sfx('tap'); var o=document.querySelectorAll('#avPick .av-opt'); for(var k=0;k<o.length;k++) o[k].classList.toggle('on', parseInt(o[k].getAttribute('data-i'),10)===i); }
function openProfile(){ pickAvIdx=DATA.avatar; var avs=''; for(var i=0;i<AVATARS.length;i++) avs+='<div class="av-opt'+(i===pickAvIdx?' on':'')+'" data-i="'+i+'" onclick="pickAv('+i+')">'+avatarSVG(i)+'</div>';
  showModal('<h2>Tu perfil</h2><p>Elige tu nombre y tu personaje.</p><input class="name-input" id="nameInput" maxlength="14" placeholder="Tu nombre" value="'+escapeHtml(DATA.name)+'"><div class="av-pick" id="avPick">'+avs+'</div><div class="result-actions"><div class="btn green" onclick="saveProfile()">Guardar</div><div class="btn ghost" onclick="closeModal()">Cancelar</div></div>'); }
function saveProfile(){ var inp=$("nameInput"); var n=inp?inp.value.trim():(WNAME||""); DATA.name=n||"Jugador"; DATA.avatar=pickAvIdx; DATA.onboarded=true; saveData(); refreshChip(); closeModal(); renderHome(); sfx('win'); }
var WNAME="";
function welcome(){ WNAME=""; wStep(0); }
function wStep(n){ if(n===0){ showModal('<div class="wintro"><div class="wglobe">'+bigGlobeSVG()+'</div><h2 class="wtitle">Le<b>x</b></h2><p class="wsub">Lectura y palabras · ÓrbitaKidx</p><div class="btn gold" onclick="sfx(\'start\');wStep(1)">¡EMPEZAR!</div></div>', true); }
  else if(n===1){ showModal('<div class="wintro"><div class="wglobe sm">'+bigGlobeSVG()+'</div><h2>¿Cómo te llamas?</h2><input class="name-input" id="nameInput" maxlength="14" placeholder="Tu nombre" value="'+escapeHtml(WNAME)+'"><div class="result-actions"><div class="btn green" onclick="wName()">Siguiente</div></div></div>', true); setTimeout(function(){ var i=$("nameInput"); if(i) i.focus(); },60); }
  else { pickAvIdx=0; var avs=''; for(var i=0;i<AVATARS.length;i++) avs+='<div class="av-opt'+(i===0?' on':'')+'" data-i="'+i+'" onclick="pickAv('+i+')">'+avatarSVG(i)+'</div>'; showModal('<h2>Elige tu personaje</h2><p>Será tu compañero de lectura.</p><div class="av-pick" id="avPick">'+avs+'</div><div class="pick-go"><div class="btn gold" onclick="saveProfile()">¡A JUGAR!</div></div>', true); } }
function wName(){ var i=$("nameInput"); WNAME=(i&&i.value.trim())||"Jugador"; sfx('tap'); wStep(2); }
function toast(a){ sfx('medal'); var t=document.createElement('div'); t.className='toast'; t.innerHTML='<div style="width:34px;height:34px">'+medalSVG(a.tier,a.icon,false)+'</div><div>¡Medalla nueva!<small>'+a.name+'</small></div>'; $("toastHost").appendChild(t); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },4000); }
function confettiBurst(){ var col=["#ffcf3f","#37c871","#3d9bff","#ff6b5e","#7b5cff","#ff9f43"]; for(var i=0;i<60;i++){ (function(){ var c=document.createElement('div'); c.className='confetti'; c.style.left=Math.random()*100+'vw'; c.style.background=col[Math.floor(Math.random()*col.length)]; document.body.appendChild(c); var dur=1800+Math.random()*1400, drift=(Math.random()-0.5)*180; c.animate([{top:'-10px',transform:'translateX(0)',opacity:1},{top:'105vh',transform:'translateX('+drift+'px) rotate('+(720*Math.random())+'deg)',opacity:.9}],{duration:dur,easing:'cubic-bezier(.3,.6,.5,1)'}); setTimeout(function(){ if(c.parentNode) c.parentNode.removeChild(c); },dur); })(); } }

document.addEventListener('keydown',function(e){ if(!QUIZ||QUIZ.answered){ if(e.key==="Enter"){ var b=document.querySelector('.btn.red'); if(b) b.click(); } return; } if(/^[1-3]$/.test(e.key)){ answer(parseInt(e.key,10)-1); } });

if('scrollRestoration' in history){ try{ history.scrollRestoration='manual'; }catch(e){} }
refreshChip(); updateSoundBtn(); renderHome(); if(!DATA.onboarded) welcome();
window.scrollTo(0,0);
window.addEventListener('load',function(){ window.scrollTo(0,0); });
</script>
